<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <title>ClassCall - 教师端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '微软雅黑', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* 头部样式 */
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header .subtitle {
            color: #666;
            font-size: 13px;
            margin-top: 3px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding: 10px 12px;
            background: #f8f9fa;
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .status-dot.connected {
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        .status-dot.disconnected {
            background: #f44336;
        }

        .status-dot.connecting {
            background: #FF9800;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        .status-text {
            font-weight: bold;
            color: #333;
            font-size: 13px;
            white-space: nowrap;
        }

        .server-info {
            font-size: 11px;
            color: #999;
        }

        /* 主内容区域 */
        .main-content {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .section {
            margin-bottom: 20px;
            padding: 15px;
            background: #fafafa;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section h2 {
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
            font-size: 13px;
        }

        select, textarea, input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: white;
            -webkit-appearance: none;
            appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 16px;
            padding-right: 35px;
        }

        select:focus, textarea:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            height: 100px;
            resize: vertical;
            line-height: 1.6;
            min-height: 80px;
        }

        /* 确认对话框样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-dialog {
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-dialog h3 {
            color: #f44336;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .modal-dialog .modal-content {
            color: #666;
            margin-bottom: 18px;
            line-height: 1.6;
            font-size: 14px;
        }

        .modal-dialog .modal-content .highlight {
            color: #f44336;
            font-weight: bold;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* 发送成功提示弹窗 */
        .toast-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            justify-content: center;
            align-items: flex-start;
            padding-top: 60px;
            pointer-events: none;
        }

        .toast-overlay.active {
            display: flex;
        }

        .toast-dialog {
            background: #4CAF50;
            color: white;
            border-radius: 10px;
            padding: 16px 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            animation: toastSlideIn 0.3s ease, toastSlideOut 0.3s ease 1.5s forwards;
            text-align: center;
            pointer-events: auto;
        }

        .toast-dialog h3 {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .toast-dialog p {
            font-size: 13px;
            opacity: 0.9;
        }

        @keyframes toastSlideIn {
            from {
                transform: translateY(-40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes toastSlideOut {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(-40px);
                opacity: 0;
            }
        }

        /* 按钮样式 */
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-height: 44px;
        }

        .btn:hover {
            background: #5a6fd6;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
            opacity: 0.8;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.6;
        }

        .btn-success {
            background: #4CAF50;
        }

        .btn-success:hover {
            background: #45a049;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .btn-warning {
            background: #FF9800;
        }

        .btn-warning:hover {
            background: #F57C00;
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
        }

        .btn-danger {
            background: #f44336;
        }

        .btn-danger:hover {
            background: #d32f2f;
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.3);
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 13px;
            min-height: 36px;
        }

        /* 在线班级样式 */
        .online-classes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 36px;
            align-items: center;
        }

        .class-badge {
            background: #e8eaf6;
            color: #3949ab;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            border: 2px solid #c5cae9;
            transition: all 0.3s;
        }

        .class-badge.online {
            background: #c8e6c9;
            color: #2e7d32;
            border-color: #a5d6a7;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .no-classes {
            color: #999;
            font-style: italic;
            font-size: 13px;
        }

        /* 消息日志 */
        .message-log {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .log-entry {
            padding: 5px 8px;
            margin-bottom: 3px;
            border-radius: 4px;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .log-entry .time {
            color: #999;
            font-size: 11px;
            white-space: nowrap;
            min-width: 60px;
            flex-shrink: 0;
        }

        .log-entry .message {
            flex: 1;
            word-break: break-all;
        }

        .log-entry.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .log-entry.error {
            background: #ffebee;
            color: #c62828;
        }

        .log-entry.info {
            background: #e3f2fd;
            color: #1565c0;
        }

        .log-entry.warning {
            background: #fff3e0;
            color: #e65100;
        }

        /* 密码区域 */
        .password-section {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            border: 2px solid #ffb74d;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .password-section h3 {
            color: #e65100;
            margin-bottom: 12px;
            font-size: 17px;
        }

        .password-hint {
            font-size: 11px;
            color: #666;
            margin-top: 6px;
            line-height: 1.4;
        }

        /* 响应式设计 - 手机端 */
        @media (max-width: 600px) {
            body {
                padding: 8px;
            }
            
            .header {
                padding: 15px;
                border-radius: 12px;
                margin-bottom: 10px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header .subtitle {
                font-size: 12px;
            }

            .status-bar {
                padding: 8px 10px;
                gap: 6px;
            }

            .status-text {
                font-size: 12px;
            }

            .main-content {
                padding: 15px;
                border-radius: 12px;
            }

            .section {
                padding: 12px;
                margin-bottom: 15px;
                border-radius: 8px;
            }

            .section h2 {
                font-size: 15px;
                margin-bottom: 10px;
                padding-bottom: 6px;
            }

            label {
                font-size: 12px;
                margin-bottom: 4px;
            }

            select, textarea, input {
                padding: 8px 10px;
                font-size: 14px;
                border-radius: 6px;
            }

            select {
                padding-right: 30px;
                background-size: 14px;
            }

            textarea {
                height: 80px;
                min-height: 70px;
                font-size: 14px;
            }

            .btn {
                padding: 10px 16px;
                font-size: 13px;
                min-height: 40px;
                border-radius: 6px;
            }

            .btn-sm {
                padding: 7px 12px;
                font-size: 12px;
                min-height: 34px;
            }

            .btn-group {
                gap: 6px;
            }

            .btn-group .btn {
                flex: 1;
                min-width: calc(50% - 6px);
            }

            .class-badge {
                padding: 5px 10px;
                font-size: 12px;
                border-radius: 14px;
            }

            .password-section {
                padding: 15px;
                border-radius: 8px;
            }

            .password-section h3 {
                font-size: 15px;
                margin-bottom: 10px;
            }

            .modal-dialog {
                padding: 20px;
                border-radius: 12px;
                margin: 0 10px;
            }

            .modal-dialog h3 {
                font-size: 16px;
            }

            .modal-dialog .modal-content {
                font-size: 13px;
            }

            .modal-buttons .btn {
                flex: 1;
            }

            .toast-dialog {
                padding: 14px 24px;
                border-radius: 8px;
            }

            .toast-dialog h3 {
                font-size: 16px;
            }

            .toast-dialog p {
                font-size: 12px;
            }

            .message-log {
                max-height: 150px;
                font-size: 11px;
                padding: 8px;
            }

            .log-entry {
                padding: 4px 6px;
                gap: 4px;
            }

            .log-entry .time {
                font-size: 10px;
                min-width: 50px;
            }

            .form-group {
                margin-bottom: 12px;
            }
        }

        /* 超小屏幕优化 */
        @media (max-width: 360px) {
            .status-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn-group .btn {
                width: 100%;
                min-width: auto;
            }
        }

        /* 横屏手机优化 */
        @media (max-width: 900px) and (orientation: landscape) {
            .section {
                padding: 10px;
                margin-bottom: 10px;
            }

            textarea {
                height: 60px;
                min-height: 50px;
            }

            .message-log {
                max-height: 100px;
            }
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 安全区域适配 */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            body {
                padding-bottom: calc(15px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <!-- 确认对话框 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-dialog">
            <h3>警告：群发通知确认</h3>
            <div class="modal-content">
                <p>您即将向 <span class="highlight">所有在线班级</span> 发送通知，这将在所有教室进行语音播报和弹窗显示。</p>
                <p style="margin-top: 8px;">请确认这是您想要的操作吗？</p>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-warning" onclick="cancelAllClassNotification()">取消</button>
                <button class="btn btn-danger" id="confirmAllClassBtn">确认发送</button>
            </div>
        </div>
    </div>

    <!-- 发送成功提示弹窗 -->
    <div class="toast-overlay" id="successToast">
        <div class="toast-dialog">
            <h3>已发送</h3>
            <p id="toastMessage">通知已成功发送</p>
        </div>
    </div>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>ClassCall</h1>
            <p class="subtitle">教师端 - 校园通知管理系统</p>
            <div class="status-bar">
                <div class="status-indicator">
                    <span class="status-dot disconnected" id="statusDot"></span>
                    <span class="status-text" id="statusText">未连接</span>
                </div>
                <span class="server-info" id="serverInfo">110.42.103.198:5605</span>
                <button class="btn btn-sm" onclick="toggleConnection()" id="connectBtn">
                    连接服务器
                </button>
            </div>
        </div>

        <!-- 密码输入区域 -->
        <div class="password-section" id="passwordSection">
            <h3>身份验证</h3>
            <div class="form-group">
                <label for="teacherName">您的称呼：</label>
                <input 
                    type="text" 
                    id="teacherName" 
                    placeholder="例如：张老师"
                    maxlength="20"
                    autocomplete="name"
                >
                <p class="password-hint">
                    此称呼将显示在教室端通知中，例如"张老师：请做好清洁"
                </p>
            </div>
            <div class="form-group">
                <label for="passwordInput">管理密码：</label>
                <input 
                    type="password" 
                    id="passwordInput" 
                    placeholder="请输入教师端密码"
                    onkeypress="if(event.key==='Enter') authenticate()"
                    autocomplete="current-password"
                >
                <p class="password-hint">
                    密码和称呼将安全保存在浏览器中，下次自动填充
                </p>
            </div>
            <div class="btn-group">
                <button class="btn btn-success" onclick="authenticate()">
                    验证并连接
                </button>
                <button class="btn btn-warning" onclick="clearAllSavedData()">
                    清除保存的信息
                </button>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div class="main-content" id="mainContent" style="display: none;">
            <!-- 在线班级监控 -->
            <div class="section">
                <h2>
                    在线班级
                    <button class="btn btn-sm btn-success" onclick="refreshClasses()" style="margin-left: auto;">
                        刷新
                    </button>
                </h2>
                <div class="online-classes" id="onlineClasses">
                    <span class="no-classes">等待连接...</span>
                </div>
            </div>

            <!-- 发送通知 -->
            <div class="section">
                <h2>发送通知</h2>
                <div class="form-group">
                    <label for="targetClass">目标班级：</label>
                    <select id="targetClass">
                    </select>
                </div>
                <div class="form-group">
                    <label for="notificationType">通知类型：</label>
                    <select id="notificationType">
                        <option value="notice">普通通知</option>
                        <option value="announcement">公共播报</option>
                        <option value="urgent">紧急通知</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="notificationContent">通知内容：</label>
                    <textarea 
                        id="notificationContent" 
                        placeholder="请输入通知内容..."
                        maxlength="500"
                    ></textarea>
                    <p class="password-hint">
                        字符计数：<span id="charCount">0</span>/500
                    </p>
                </div>
                <div class="btn-group">
                    <button class="btn btn-success" onclick="sendNotification()">
                        发送通知
                    </button>
                    <button class="btn btn-danger" onclick="sendUrgentNotification()">
                        紧急通知
                    </button>
                    <button class="btn btn-warning" onclick="clearForm()">
                        清空内容
                    </button>
                </div>
            </div>

            <!-- 快捷通知模板 -->
            <div class="section">
                <h2>快捷模板</h2>
                <div class="btn-group">
                    <button class="btn btn-sm" onclick="useTemplate('math')">
                        数学课代表
                    </button>
                    <button class="btn btn-sm" onclick="useTemplate('english')">
                        英语课代表
                    </button>
                    <button class="btn btn-sm" onclick="useTemplate('chinese')">
                        语文课代表
                    </button>
                    <button class="btn btn-sm" onclick="useTemplate('clean')">
                        卫生检查
                    </button>
                </div>
            </div>

            <!-- 消息日志 -->
            <div class="section">
                <h2>
                    操作日志
                    <button class="btn btn-sm" onclick="clearLog()" style="margin-left: auto;">
                        清空日志
                    </button>
                </h2>
                <div class="message-log" id="messageLog">
                    <div class="log-entry info">
                        <span class="time">--:--:--</span>
                        <span class="message">系统就绪，等待连接...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ 配置 ============
        // 自动判断协议：HTTPS页面使用WSS，HTTP页面使用WS
        const WS_PROTOCOL = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WS_URL = WS_PROTOCOL + '//110.42.103.198:5605';
        const COOKIE_NAME_PASSWORD = 'teacher_password';
        const COOKIE_NAME_NAME = 'teacher_name';
        const COOKIE_NAME_TARGET = 'teacher_target_class';
        const COOKIE_NAME_TYPE = 'teacher_notification_type';
        const COOKIE_NAME_CONTENT = 'teacher_notification_content';
        const COOKIE_DAYS = 365;
        
        let currentTeacherName = '';
        let pendingNotification = null;
        
        let ws = null;
        let isConnected = false;
        let isConnecting = false;
        let reconnectTimer = null;
        let heartbeatTimer = null;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 10;
        
        // ============ 初始化 ============
        window.onload = function() {
            document.getElementById('serverInfo').textContent = WS_URL.replace('ws://', '');
            
            // 恢复保存的信息
            restoreSavedData();
            
            // 监听文本区域字符计数
            const textarea = document.getElementById('notificationContent');
            textarea.addEventListener('input', function() {
                updateCharCount();
                saveFormData();
            });
            
            // 监听下拉框变化
            document.getElementById('targetClass').addEventListener('change', saveFormData);
            document.getElementById('notificationType').addEventListener('change', saveFormData);
            
            // 监听称呼输入框变化
            document.getElementById('teacherName').addEventListener('input', function() {
                setCookie(COOKIE_NAME_NAME, this.value.trim());
                currentTeacherName = this.value.trim();
            });

            // 移动端双击禁止缩放
            document.addEventListener('dblclick', function(e) {
                if (e.target.tagName === 'BUTTON') {
                    e.preventDefault();
                }
            }, { passive: false });
        };

        // ============ Cookie 操作 ============
        function setCookie(name, value, days = COOKIE_DAYS) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + encodeURIComponent(value) + ";" + expires + ";path=/;SameSite=Strict";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(nameEQ) === 0) {
                    return decodeURIComponent(c.substring(nameEQ.length, c.length));
                }
            }
            return null;
        }

        function deleteCookie(name) {
            document.cookie = name + '=; Max-Age=-99999999; path=/';
        }

        // ============ 数据保存和恢复 ============
        function saveFormData() {
            setCookie(COOKIE_NAME_TARGET, document.getElementById('targetClass').value);
            setCookie(COOKIE_NAME_TYPE, document.getElementById('notificationType').value);
            setCookie(COOKIE_NAME_CONTENT, document.getElementById('notificationContent').value);
        }

        function restoreSavedData() {
            const savedName = getCookie(COOKIE_NAME_NAME);
            if (savedName) {
                document.getElementById('teacherName').value = savedName;
                currentTeacherName = savedName;
            }
            
            const savedPassword = getCookie(COOKIE_NAME_PASSWORD);
            if (savedPassword) {
                document.getElementById('passwordInput').value = savedPassword;
            }
            
            restoreFormData();
            
            if (savedPassword && savedName) {
                authenticate();
            }
        }

        function restoreFormData() {
            const savedTarget = getCookie(COOKIE_NAME_TARGET);
            const savedType = getCookie(COOKIE_NAME_TYPE);
            const savedContent = getCookie(COOKIE_NAME_CONTENT);
            
            setTimeout(() => {
                if (savedTarget) {
                    const targetSelect = document.getElementById('targetClass');
                    for (let i = 0; i < targetSelect.options.length; i++) {
                        if (targetSelect.options[i].value === savedTarget) {
                            targetSelect.value = savedTarget;
                            break;
                        }
                    }
                }
                
                if (savedType) {
                    document.getElementById('notificationType').value = savedType;
                }
                
                if (savedContent) {
                    document.getElementById('notificationContent').value = savedContent;
                    updateCharCount();
                }
            }, 100);
        }

        // ============ 认证 ============
        function authenticate() {
            const password = document.getElementById('passwordInput').value.trim();
            const teacherName = document.getElementById('teacherName').value.trim();
            
            if (!password) {
                addLog('请输入教师端密码', 'warning');
                return;
            }
            
            if (!teacherName) {
                addLog('请输入您的称呼', 'warning');
                return;
            }
            
            setCookie(COOKIE_NAME_PASSWORD, password);
            setCookie(COOKIE_NAME_NAME, teacherName);
            currentTeacherName = teacherName;
            
            connectWebSocket(password, teacherName);
        }

        function clearAllSavedData() {
            deleteCookie(COOKIE_NAME_PASSWORD);
            deleteCookie(COOKIE_NAME_NAME);
            deleteCookie(COOKIE_NAME_TARGET);
            deleteCookie(COOKIE_NAME_TYPE);
            deleteCookie(COOKIE_NAME_CONTENT);
            
            document.getElementById('passwordInput').value = '';
            document.getElementById('teacherName').value = '';
            document.getElementById('notificationContent').value = '';
            document.getElementById('notificationType').value = 'notice';
            currentTeacherName = '';
            
            updateCharCount();
            addLog('已清除所有保存的信息', 'info');
            
            if (isConnected) {
                disconnect();
            }
            
            document.getElementById('passwordSection').style.display = 'block';
            document.getElementById('mainContent').style.display = 'none';
        }

        // ============ WebSocket 连接管理 ============
        function connectWebSocket(password, teacherName) {
            if (isConnected || isConnecting) return;
            
            isConnecting = true;
            updateConnectionStatus('connecting');
            addLog('正在连接服务器...', 'info');
            
            try {
                ws = new WebSocket(WS_URL);
                
                ws.onopen = function() {
                    isConnected = true;
                    isConnecting = false;
                    reconnectAttempts = 0;
                    updateConnectionStatus('connected');
                    addLog('WebSocket连接成功', 'success');
                    
                    ws.send(JSON.stringify({
                        type: 'auth_teacher',
                        password: password,
                        teacher_name: teacherName
                    }));
                    
                    startHeartbeat();
                    
                    document.getElementById('passwordSection').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                };
                
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        handleMessage(data);
                    } catch (e) {
                        addLog('消息解析失败', 'error');
                    }
                };
                
                ws.onerror = function() {
                    isConnecting = false;
                    addLog('WebSocket连接错误', 'error');
                };
                
                ws.onclose = function(event) {
                    isConnected = false;
                    isConnecting = false;
                    updateConnectionStatus('disconnected');
                    stopHeartbeat();
                    
                    if (event.code !== 1000) {
                        addLog('连接断开 (代码: ' + event.code + ')', 'warning');
                        
                        if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                            const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                            addLog((delay/1000) + '秒后重连...', 'info');
                            
                            if (reconnectTimer) clearTimeout(reconnectTimer);
                            reconnectTimer = setTimeout(() => {
                                reconnectAttempts++;
                                const savedPwd = getCookie(COOKIE_NAME_PASSWORD);
                                const savedName = getCookie(COOKIE_NAME_NAME);
                                if (savedPwd && savedName) {
                                    connectWebSocket(savedPwd, savedName);
                                } else {
                                    document.getElementById('passwordSection').style.display = 'block';
                                    document.getElementById('mainContent').style.display = 'none';
                                }
                            }, delay);
                        } else {
                            addLog('达到最大重连次数，请手动重连', 'error');
                            document.getElementById('passwordSection').style.display = 'block';
                            document.getElementById('mainContent').style.display = 'none';
                        }
                    }
                };
            } catch (e) {
                isConnecting = false;
                addLog('创建连接失败: ' + e.message, 'error');
            }
        }

        function disconnect() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            stopHeartbeat();
            
            if (ws) {
                ws.close(1000, '用户主动断开');
                ws = null;
            }
            
            isConnected = false;
            isConnecting = false;
            reconnectAttempts = 0;
            updateConnectionStatus('disconnected');
            addLog('已断开连接', 'info');
        }

        function toggleConnection() {
            if (isConnected) {
                disconnect();
            } else {
                const password = getCookie(COOKIE_NAME_PASSWORD) || document.getElementById('passwordInput').value.trim();
                const teacherName = getCookie(COOKIE_NAME_NAME) || document.getElementById('teacherName').value.trim();
                
                if (password && teacherName) {
                    connectWebSocket(password, teacherName);
                } else {
                    document.getElementById('passwordSection').style.display = 'block';
                    addLog('请先输入认证信息', 'warning');
                }
            }
        }

        // ============ 心跳 ============
        function startHeartbeat() {
            stopHeartbeat();
            heartbeatTimer = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'ping' }));
                }
            }, 30000);
        }

        function stopHeartbeat() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }

        // ============ 连接状态显示 ============
        function updateConnectionStatus(status) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const btn = document.getElementById('connectBtn');
            
            dot.className = 'status-dot';
            
            switch(status) {
                case 'connected':
                    dot.classList.add('connected');
                    text.textContent = '已连接';
                    text.style.color = '#4CAF50';
                    btn.textContent = '断开连接';
                    btn.className = 'btn btn-sm btn-danger';
                    break;
                case 'disconnected':
                    dot.classList.add('disconnected');
                    text.textContent = '未连接';
                    text.style.color = '#f44336';
                    btn.textContent = '连接服务器';
                    btn.className = 'btn btn-sm btn-success';
                    break;
                case 'connecting':
                    dot.classList.add('connecting');
                    text.textContent = '连接中...';
                    text.style.color = '#FF9800';
                    btn.textContent = '连接中...';
                    btn.className = 'btn btn-sm btn-warning';
                    btn.disabled = true;
                    setTimeout(() => { btn.disabled = false; }, 3000);
                    break;
            }
        }

        // ============ 消息处理 ============
        function handleMessage(data) {
            switch (data.type) {
                case 'auth_success':
                    addLog('[OK] ' + data.message, 'success');
                    if (data.teacher_name) {
                        currentTeacherName = data.teacher_name;
                    }
                    break;
                
                case 'error':
                    addLog('[X] ' + data.message, 'error');
                    if (data.message.includes('验证失败') || data.message.includes('密码')) {
                        deleteCookie(COOKIE_NAME_PASSWORD);
                        disconnect();
                        document.getElementById('passwordSection').style.display = 'block';
                        document.getElementById('mainContent').style.display = 'none';
                        addLog('认证失败，请重新输入信息', 'warning');
                    }
                    break;
                
                case 'online_classes':
                    updateOnlineClasses(data.classes);
                    break;
                
                case 'success':
                    addLog('[OK] ' + data.message, 'success');
                    showSuccessToast(data.message);
                    break;
                
                case 'pong':
                    break;
                
                default:
                    addLog('收到未知消息: ' + data.type, 'warning');
            }
        }

        // ============ 在线班级管理 ============
        function updateOnlineClasses(classes) {
            const container = document.getElementById('onlineClasses');
            const select = document.getElementById('targetClass');
            const currentValue = select.value;
            
            if (!classes || classes.length === 0) {
                container.innerHTML = '<span class="no-classes">暂无班级在线</span>';
            } else {
                container.innerHTML = classes.map(c => 
                    '<span class="class-badge online">' + c + '</span>'
                ).join('');
                addLog('在线班级: ' + classes.join(', '), 'info');
            }
            
            select.innerHTML = '';
            if (classes && classes.length > 0) {
                classes.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c;
                    option.textContent = c;
                    select.appendChild(option);
                });
            }
            
            const allOption = document.createElement('option');
            allOption.value = 'all';
            allOption.textContent = '所有在线班级（慎重选择！）';
            allOption.style.color = '#f44336';
            allOption.style.fontWeight = 'bold';
            select.appendChild(allOption);
            
            if (currentValue) {
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].value === currentValue) {
                        select.value = currentValue;
                        break;
                    }
                }
            } else {
                restoreFormData();
            }
        }

        function refreshClasses() {
            if (isConnected && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
                addLog('已请求刷新班级列表', 'info');
            } else {
                addLog('未连接到服务器', 'warning');
            }
        }

        // ============ 发送成功弹窗 ============
        function showSuccessToast(message) {
            const toast = document.getElementById('successToast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message || '通知已成功发送';
            toast.classList.add('active');
            
            setTimeout(() => {
                toast.classList.remove('active');
            }, 1800);
        }

        // ============ 发送通知 ============
        function sendNotification(type = null) {
            if (!isConnected || !ws || ws.readyState !== WebSocket.OPEN) {
                addLog('未连接到服务器，无法发送通知', 'error');
                return;
            }
            
            const targetClass = document.getElementById('targetClass').value;
            const notificationType = type || document.getElementById('notificationType').value;
            const content = document.getElementById('notificationContent').value.trim();
            
            if (!content) {
                addLog('请输入通知内容', 'warning');
                return;
            }
            
            if (targetClass === 'all') {
                pendingNotification = {
                    targetClass: targetClass,
                    notificationType: notificationType,
                    content: content
                };
                
                document.getElementById('confirmAllClassBtn').onclick = function() {
                    executeSendNotification(pendingNotification);
                    closeConfirmModal();
                };
                
                document.getElementById('confirmModal').classList.add('active');
                return;
            }
            
            executeSendNotification({
                targetClass: targetClass,
                notificationType: notificationType,
                content: content
            });
        }
        
        function executeSendNotification(notificationData) {
            const message = {
                type: 'send_notification',
                class_id: notificationData.targetClass,
                notification_type: notificationData.notificationType,
                content: notificationData.content,
                teacher_name: currentTeacherName
            };
            
            try {
                ws.send(JSON.stringify(message));
                
                const typeNames = {
                    'notice': '普通通知',
                    'announcement': '公共播报',
                    'urgent': '紧急通知'
                };
                
                const targetName = notificationData.targetClass === 'all' ? '所有在线班级' : notificationData.targetClass;
                addLog('[发送] ' + currentTeacherName + ' - ' + typeNames[notificationData.notificationType] + '到 ' + targetName, 'success');
                
                showSuccessToast('已发送到 ' + targetName);
            } catch (e) {
                addLog('发送失败: ' + e.message, 'error');
            }
        }

        function sendUrgentNotification() {
            document.getElementById('notificationType').value = 'urgent';
            saveFormData();
            sendNotification('urgent');
        }
        
        function cancelAllClassNotification() {
            pendingNotification = null;
            closeConfirmModal();
            addLog('已取消群发通知', 'info');
        }
        
        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
        }

        // ============ 快捷模板 ============
        function useTemplate(type) {
            const templates = {
                'math': { type: 'notice', content: '请数学课代表去办公室' },
                'english': { type: 'notice', content: '请英语课代表去办公室' },
                'chinese': { type: 'notice', content: '请语文课代表去办公室' },
                'clean': { type: 'announcement', content: '请各班级做好教室卫生打扫工作，下午将进行检查。' }
            };
            
            const template = templates[type];
            if (template) {
                document.getElementById('notificationType').value = template.type;
                document.getElementById('notificationContent').value = template.content;
                updateCharCount();
                saveFormData();
                addLog('已加载模板: ' + getTemplateName(type), 'info');
            }
        }
        
        function getTemplateName(type) {
            const names = {
                'math': '数学课代表',
                'english': '英语课代表',
                'chinese': '语文课代表',
                'clean': '卫生检查'
            };
            return names[type] || type;
        }

        // ============ UI辅助 ============
        function clearForm() {
            document.getElementById('notificationContent').value = '';
            updateCharCount();
            setCookie(COOKIE_NAME_CONTENT, '');
            addLog('内容已清空', 'info');
        }

        function updateCharCount() {
            const textarea = document.getElementById('notificationContent');
            const count = document.getElementById('charCount');
            const length = textarea.value.length;
            count.textContent = length;
            count.style.color = length > 400 ? '#f44336' : length > 300 ? '#FF9800' : '#999';
        }

        // ============ 日志管理 ============
        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('messageLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            
            const now = new Date();
            const time = now.toLocaleTimeString('zh-CN', { hour12: false });
            
            entry.innerHTML = 
                '<span class="time">' + time + '</span>' +
                '<span class="message">' + message + '</span>';
            
            logDiv.insertBefore(entry, logDiv.firstChild);
            
            while (logDiv.children.length > 100) {
                logDiv.removeChild(logDiv.lastChild);
            }
        }

        function clearLog() {
            const logDiv = document.getElementById('messageLog');
            logDiv.innerHTML = 
                '<div class="log-entry info">' +
                    '<span class="time">' + new Date().toLocaleTimeString('zh-CN', { hour12: false }) + '</span>' +
                    '<span class="message">日志已清空</span>' +
                '</div>';
        }

        // ============ 页面关闭处理 ============
        window.onbeforeunload = function() {
            saveFormData();
            if (isConnected) disconnect();
        };

        // ============ 键盘快捷键 ============
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.key === 'Enter') {
                event.preventDefault();
                sendNotification();
            }
            
            if (event.key === 'Escape') {
                const modal = document.getElementById('confirmModal');
                if (modal.classList.contains('active')) {
                    cancelAllClassNotification();
                }
            }
        });

        // ============ 弹窗外部点击关闭 ============
        document.getElementById('confirmModal').addEventListener('click', function(event) {
            if (event.target === this) {
                cancelAllClassNotification();
            }
        });

        // 移动端触摸优化
        document.addEventListener('touchstart', function() {}, { passive: true });
    </script>
</body>
</html>
